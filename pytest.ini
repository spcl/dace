[pytest]
markers =
    gpu: Test requires a compute-capable GPU (select with '-m "gpu"')
    tensorflow: Test requires TensorFlow installed (select with '-m "tensorflow"')
    mkl: Test requires Intel MKL (select with '-m "mkl"')
    openblas: Test requires OpenBLAS (select with '-m "openblas"')
    papi: Test requires PAPI counters to work (select with '-m "papi"')
    mlir: Test requires pyMLIR, MLIR tools and LLVM compiler to work (select with '-m "mlir"')
    sve: Test requires SVE-capable ARM processor (select with '-m "sve"')
    lapack: Test for the LAPACK library that requires OpenBLAS (select with '-m "lapack"')
    fftw: Test requires the FFTW3 library (libfftw3-dev) (select with '-m "fftw"')
    mpi: Test requires MPI. (select with '-m mpi')
    scalapack: Test requires ScaLAPACK (Intel MKL and OpenMPI). (select with '-m scalapack')
    datainstrument: Test uses data instrumentation (select with '-m datainstrument')
    hptt: Test requires the HPTT library (select with '-m "hptt')
    tblis: Test requires the TBLIS library (select with '-m "tblis"')
    long: Test runs for a long time and is skipped in CI (select with '-m "long"')
    integration: End-to-end integration test (e.g. CloudSC); excluded from the usual pipeline and run by the dedicated integration workflow (select with '-m "integration"')
    torch: Test for the PyTorch/ONNX frontend (select with '-m "torch"')
    autodiff: Test for automatic differentiation (select with '-m "autodiff"')
    onnx: Test for the ONNX frontend (select with '-m "onnx"')
    sequential: Test must be run sequentially (select with '-m "sequential"')
    no_autoopt: skip this test if auto-optimization is enabled (select with '-m "no_autoopt"')
    fp16: Half-precision (float16) lowering and numerics. Applied at module level by the fp16 suites;
        runs in the general GPU selection AND in the dedicated fp16 leg of the CSCS GPU pipeline,
        which is the isolated signal for a dtype whose bugs are silent narrowings (select with '-m "fp16"')
    perf: Performance regression test -- canon vs auto_optimize timing ratios over the corpus (select with '-m "perf"')
    vectorization: Vectorization test. Applied automatically by path; runs in the dedicated vectorization workflow, not general CI (select with '-m "vectorization"')
    canonicalization: Canonicalization test. Applied automatically by path; runs in the dedicated canonicalization workflow, not general CI (select with '-m "canonicalization"')
    layout: Layout-permutation sweep. Applied automatically by path; runs in its own job in general CI, not in the general selection (select with '-m "layout"')
    loop2x_libnodes: Loop-to-X lifting test, or a library node this branch introduces (not on main). Applied automatically by file name; runs in its own workflow, not general CI (select with '-m "loop2x_libnodes"')
    corpus: Whole-kernel corpus test (TSVC / polybench / npbench / CloudSC). Applied automatically by path; each case COMPILES AND RUNS a C++ program, so these live in the dedicated corpus workflow rather than general CI (select with '-m "corpus"')
    old_gpu_codegen_only: Test only works with the legacy CUDA codegen. Auto-skipped when compiler.cuda.implementation == experimental.
    new_gpu_codegen_only: Test only works with the experimental CUDA codegen. Auto-skipped when compiler.cuda.implementation == legacy.
python_files =
    test_*.py
    *_test.py
    *_cudatest.py
addopts = --ignore=dace/external --color=yes -rs

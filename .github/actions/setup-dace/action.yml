name: Set up DaCe
description: Python toolchain plus the apt and pip dependencies shared by the hosted (GitHub-runner) CI jobs.

# Callers must run ``actions/checkout@v7`` themselves, first: GitHub resolves a local action from the
# checked-out workspace, so the repository has to be on disk before this file can be referenced. v7 is
# the version every workflow in this repository uses -- keep it in step with this note.

inputs:
  python-version:
    description: Version passed to actions/setup-python.
    required: true
  apt-packages:
    description: System packages to install.
    default: libyaml-dev cmake libblas-dev libopenblas-dev liblapacke-dev
  pip-packages:
    description: Extra pip packages installed before DaCe itself.
    default: pytest-xdist
  extras:
    description: DaCe extras for the editable install.
    default: testing
  codecov:
    description: Also fetch the codecov uploader into the workspace.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        # man-db auto-update dominates apt time on the hosted images.
        echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
        sudo dpkg-reconfigure man-db
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.apt-packages }}
        python -m pip install --upgrade pip
        pip install ${{ inputs.pip-packages }}
        pip install -e ".[${{ inputs.extras }}]"

    - name: Install codecov uploader
      if: inputs.codecov == 'true'
      shell: bash
      run: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov

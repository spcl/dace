name: Report overall coverage
description: Combine the self-hosted run's coverage data and upload it when codecov.io is reachable.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        source ~/.venv/bin/activate # activate venv
        export COVERAGE_RCFILE=`pwd`/.coveragerc
        coverage combine . */; coverage report; coverage xml
        reachable=0
        ping -W 2 -c 1 codecov.io || reachable=$?
        if [ $reachable -eq 0 ]; then
          ./codecov
        else
          echo "Codecov.io is unreachable"
        fi

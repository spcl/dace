name: "Copilot Setup Steps"
on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-dace
        with:
          python-version: '3.11'
          # g++-aarch64-linux-gnu enables the NEON/SVE -fsyntax-only intrinsic-header
          # tests (tests/passes/vectorization/intrinsics/test_horizontal_reduce_header.py)
          # to run instead of skip in the agent environment.
          apt-packages: g++ build-essential g++-aarch64-linux-gnu cmake
          pip-packages: pytest pytest-cov flake8 pytest-xdist coverage
          groups: testing,linting
          extras: ml

      - name: Set up pre-commit
        run: |
          pre-commit install
          pre-commit run

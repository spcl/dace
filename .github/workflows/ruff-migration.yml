# TEMPORARY. Runs the one-time yapf -> ruff format migration so that the repository-wide
# reformat is authored by github-actions[bot]. Dropped from the branch before merge.
#
# Drives pre-commit rather than `ruff format .`: a bare walk respects tests/.gitignore
# (`data/`) and skips tracked files under tests/sdfg/data/ that the hook formats.
name: Ruff Migration Formatter

on:
  push:
    branches: [ruff-migration]
  workflow_dispatch:

env:
  UV_FROZEN: 1
  UV_NO_DEV: 1
  UV_NO_EDITABLE: 1

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    name: reformat and push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check repository
      uses: actions/checkout@v7
      with:
        # Check out the branch, not a detached HEAD, so the push has an upstream.
        ref: ${{ github.ref_name }}
        persist-credentials: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.10'
        enable-cache: true

    - name: Apply formatting
      # pre-commit exits non-zero because the hooks rewrote files.
      run: uv run --only-group=linting pre-commit run --all-files || true

    - name: Verify the tree is now clean
      run: uv run --only-group=linting pre-commit run --all-files

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --quiet && echo "Already formatted, nothing to commit." && exit 0
        git commit -m "style: reformat the repository with ruff format"
        git push

name: Corpus

# Dedicated runner for the whole-kernel corpora (TSVC, polybench, npbench) and the corpus fixture
# guards, marked as ``corpus`` by path or file name in tests/conftest.py.
#
# Split out of general CI because the cost profile is different in kind: a corpus case builds an
# SDFG, COMPILES a C++ program and RUNS it, once per kernel, so wall time tracks the kernel count
# rather than the assertion count. General CI carried ~880 of these.
#
# The exception is the fixture guard (oracle_is_not_vacuous), which compiles nothing -- it runs each
# kernel's numpy oracle and requires it to move at least one array, catching gate entries that
# certify nothing (an empty range, a threshold no sample clears). Cheap, and it belongs next to the
# corpora it guards.

on:
  push:
    branches: [ main, ci-fix ]
  pull_request:
    branches: [ main, ci-fix ]
  merge_group:
    branches: [ main, ci-fix ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  corpus:
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - uses: ./.github/actions/setup-dace
      with:
        python-version: '3.14'
        apt-packages: >-
          libyaml-dev cmake
          libblas-dev libopenblas-dev liblapacke-dev
        pip-packages: pytest-xdist
        extras: testing

    - name: Test with pytest
      run: |
        export NOSTATUSBAR=1
        export DACE_cache=unique
        # Pinned, not left to the defaults: nearly every case compiles, so build caching is most of
        # the wall time here.
        export DACE_compiler_command_cache=1
        export DACE_compiler_precompiled_header=1
        pytest -n auto --tb=short --timeout_method thread --timeout=600 \
          -m "corpus and not gpu and not long and not sequential and not perf and not mpi"

name: NASA/NOAA pyFV3 repository build test

on:
  push:
    branches: [ main, ci-fix, romanc/stree-v2 ]
  pull_request:
    branches: [ main, ci-fix, romanc/stree-v2 ]
  merge_group:
    branches: [ main, ci-fix, romanc/stree-v2 ]

env:
  PYTHONHASHSEED: '0'
  UV_FROZEN: 1 # sync without updating uv.lock
  UV_NO_DEV: 1 # don't install dev dependency group by default

defaults:
    run:
      shell: bash

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build_and_validate_pyFV3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    strategy:
      fail-fast: false
      # Riem_Solver3 is left out: its download and regression steps were skipped (failing), so its runner only
      # built pyFV3.
      matrix:
        include:
          - name: "Shallow water lagrangian dynamics on D-grid (D_SW) (on rank 0 only)"
            archive: "8.1.3_c12_6ranks_standard.D_SW.tar.gz"
            module: "D_SW"
            extra_args: "--which_rank=0"
          - name: "Remapping (on rank 0 only)"
            archive: "8.1.3_c12_6ranks_standard.Remapping.tar.gz"
            module: "Remapping"
            extra_args: "--which_rank=0"
    name: "${{ matrix.module }} regression test"

    steps:
    - name: Checkout pyFV3
      uses: actions/checkout@v7
      with:
        repository: 'NOAA-GFDL/pyFV3'
        path: 'pyFV3'

    - name: Checkout dace
      uses: actions/checkout@v7
      with:
        path: 'dace'
        submodules: 'recursive'

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.12
        enable-cache: true
        pyproject-file: dace/pyproject.toml
        cache-dependency-glob: dace/pyproject.toml

    - name: Install OpenMPI
      run: |
        # A mirror outside Canonical's DNS, see .github/actions/setup-dace
        echo -e 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:9' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin

    # Duplicated from .github/actions/setup-dace rather than taken from it: this job checks dace out
    # into a subdirectory and installs pyFV3 before dace on purpose, which the action's fused install
    # step would undo. Only the compiler selection is needed here.
    - name: Select a C++ compiler without the GCC 13 vectorizer miscompile
      run: |
        # GCC 13's auto-vectorizer mislowers the select the readable code generator emits: it reuses
        # the low-half lane mask for the high-half vmaskmovpd, so the upper half of each vector reads
        # back as zeros. A silent wrong answer, fixed in GCC 14.
        sudo apt-get install -y g++-14
        echo "CXX=g++-14" >> $GITHUB_ENV
        echo "CC=gcc-14" >> $GITHUB_ENV
        echo "DACE_compiler_cpu_executable=$(command -v g++-14)" >> $GITHUB_ENV

    # We install `dace` after `pyFV3` to build pyFV3 with the current version of DaCe
    - name: Install pyFV3 and dace
      run: |
        uv venv .venv
        export VIRTUAL_ENV="$PWD/.venv"
        export PATH="$VIRTUAL_ENV/bin:$PATH"
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
        echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
        uv pip install ./pyFV3[ndsl,test]
        uv pip install ./dace

    - name: Download data
      run: |
        mkdir -p pyFV3/test_data
        cd pyFV3/test_data
        wget --retry-connrefused https://portal.nccs.nasa.gov/datashare/astg/smt/pace-regression-data/${{ matrix.archive }}
        tar -xzvf ${{ matrix.archive }}
        cd ../..

    - name: "Regression test: ${{ matrix.name }}"
      env:
        FV3_DACEMODE: BuildAndRun
        NDSL_LOGLEVEL: Debug
        # Makes the pyfv3_legacy_nested_sdfgs plugin importable (see its docstring)
        PYTHONPATH: ${{ github.workspace }}/dace/ci
      run: |
        source .venv/bin/activate
        # -p pyfv3_legacy_nested_sdfgs converts gt4py's legacy origin/domain wrapper before it is inlined
        pytest -v -s -p pyfv3_legacy_nested_sdfgs --data_path=./pyFV3/test_data/8.1.3/c12_6ranks_standard/dycore \
            --backend=orch:dace:cpu:KIJ --which_modules=${{ matrix.module }} \
            ${{ matrix.extra_args }} \
            --threshold_overrides_file=./pyFV3/tests/savepoint/translate/overrides/standard.yaml \
            ./pyFV3/tests/savepoint

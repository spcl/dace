name: Heterogeneous Tests

on:
  push:
    branches: [ main, ci-fix ]
  pull_request:
    branches: [ main, ci-fix ]
  merge_group:
    branches: [ main, ci-fix ]

env:
  CUDA_HOME: /usr/local/cuda
  CUDACXX: nvcc
  MKLROOT: /opt/intel/oneapi/mkl/latest/
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  PYTHONHASHSEED: '0'
  UV_FROZEN: 1 # sync without updating uv.lock
  UV_NO_DEV: 1 # don't install dev dependency group by default

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test-heterogeneous:
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - uses: ./.github/actions/setup-dace-venv
      with:
        pip-packages: flake8 pytest-xdist coverage mpi4py pytest-mpi
        codecov: 'true'

    - name: Check mpi4py
      run: |
        source ~/.venv/bin/activate # activate venv
        # The wheel dlopens libmpi on first use; without one it fails at every import, not here.
        MPI4PY_RC_INITIALIZE=0 python -c "from mpi4py import MPI; print(MPI.Get_library_version())"

    - name: Test dependencies
      run: |
        uv run papi_avail

    - name: Run parallel pytest
      run: |
        export DACE_cache=unique
        uv run pytest --cov-report=xml --cov=dace --tb=short --timeout_method thread --timeout=300 -m "papi or datainstrument"

    - name: Run MPI tests
      run: |
        export NOSTATUSBAR=1
        ulimit -s 65536 || true
        export OMP_STACKSIZE=64M
        export DACE_compiler_max_stack_array_size=65536
        export DACE_cache=single
        export COVERAGE_RCFILE=`pwd`/.coveragerc
        export PYTHON_BINARY="uv run coverage run --source=dace --parallel-mode"
        ./tests/mpi_test.sh


    - name: Test MPI with pytest
      run: |
        export NOSTATUSBAR=1
        ulimit -s 65536 || true
        export OMP_STACKSIZE=64M
        export DACE_compiler_max_stack_array_size=65536
        export DACE_testing_serialization=1
        export DACE_testing_deserialize_exception=1
        export DACE_cache=unique
        # mpi4py's excepthook calls MPI_ABORT, which kills every rank immediately: a traceback
        # still sitting in a pipe buffer is lost, and the job reports only "errorcode 1".
        export PYTHONUNBUFFERED=1
        mpirun -n 2 uv run coverage run --source=dace --parallel-mode -m pytest -x --with-mpi --tb=short --timeout_method thread --timeout=300 -m "mpi and not gpu"

    - name: Test ScaLAPACK PBLAS with pytest
      run: |
        export NOSTATUSBAR=1
        ulimit -s 65536 || true
        export OMP_STACKSIZE=64M
        export DACE_compiler_max_stack_array_size=65536
        export DACE_testing_serialization=1
        export DACE_testing_deserialize_exception=1
        export DACE_cache=unique
        export DACE_library_pblas_default_implementation=ReferenceOpenMPI
        # See the MPI step above: without this an aborting rank takes its traceback with it.
        export PYTHONUNBUFFERED=1
        # TEMPORARY [WIP] one probe, removed with the finding: the trigger for the wrong pgemm
        # numbers is an OpenMP runtime mapped into the process before the ScaLAPACK program runs.
        # This shows the MPI thread level it happens at, so "raise the required level" can be ruled
        # in or out on evidence rather than on argument.
        GOMP=$(ls /usr/lib/x86_64-linux-gnu/libgomp.so.1* 2>/dev/null | head -1)
        LD_PRELOAD="$GOMP" mpirun -n 2 --oversubscribe uv run python -c \
          "import dace; from mpi4py import MPI; print('LEVEL rank', MPI.COMM_WORLD.Get_rank(), 'provided', MPI.Query_thread(), 'MULTIPLE', MPI.THREAD_MULTIPLE)" || true
        if LD_PRELOAD="$GOMP" mpirun -n 2 --oversubscribe uv run python -m pytest -x --with-mpi --tb=no \
            -p no:cacheprovider --timeout_method thread --timeout=600 -m "scalapack" \
            tests/library/pblas/pgemm_test.py > /tmp/probe_gomp.log 2>&1; then
          echo "PROBE gomp_preloaded PASS"
        else
          echo "PROBE gomp_preloaded FAIL"
        fi
        # The real thing, whose exit code decides this step.
        for i in {1..4}
        do
          mpirun -n "$i" --oversubscribe uv run coverage run --source=dace --parallel-mode -m pytest -x --with-mpi --tb=short --timeout_method thread --timeout=300 -m "scalapack"
        done

    - name: Report overall coverage
      uses: ./.github/actions/report-coverage

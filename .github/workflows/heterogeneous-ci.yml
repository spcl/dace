name: Heterogeneous Tests

on:
  push:
    branches: [ main, ci-fix ]
  pull_request:
    branches: [ main, ci-fix ]
  merge_group:
    branches: [ main, ci-fix ]

env:
  CUDA_HOME: /usr/local/cuda
  CUDACXX: nvcc
  MKLROOT: /opt/intel/oneapi/mkl/latest/
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  PYTHONHASHSEED: '0'
  UV_FROZEN: 1 # sync without updating uv.lock
  UV_NO_DEV: 1 # don't install dev dependency group by default

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test-heterogeneous:
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - uses: ./.github/actions/setup-dace-venv
      with:
        pip-packages: flake8 pytest-xdist coverage mpi4py pytest-mpi
        codecov: 'true'

    - name: Check mpi4py
      run: |
        source ~/.venv/bin/activate # activate venv
        # The wheel dlopens libmpi on first use; without one it fails at every import, not here.
        MPI4PY_RC_INITIALIZE=0 python -c "from mpi4py import MPI; print(MPI.Get_library_version())"

    - name: Test dependencies
      run: |
        uv run papi_avail

    - name: Run parallel pytest
      run: |
        export DACE_cache=unique
        uv run pytest --cov-report=xml --cov=dace --tb=short --timeout_method thread --timeout=300 -m "papi or datainstrument"

    - name: Run MPI tests
      run: |
        export NOSTATUSBAR=1
        ulimit -s 65536 || true
        export OMP_STACKSIZE=64M
        export DACE_compiler_max_stack_array_size=65536
        export DACE_cache=single
        export COVERAGE_RCFILE=`pwd`/.coveragerc
        export PYTHON_BINARY="uv run coverage run --source=dace --parallel-mode"
        ./tests/mpi_test.sh


    - name: Test MPI with pytest
      run: |
        export NOSTATUSBAR=1
        ulimit -s 65536 || true
        export OMP_STACKSIZE=64M
        export DACE_compiler_max_stack_array_size=65536
        export DACE_testing_serialization=1
        export DACE_testing_deserialize_exception=1
        export DACE_cache=unique
        # mpi4py's excepthook calls MPI_ABORT, which kills every rank immediately: a traceback
        # still sitting in a pipe buffer is lost, and the job reports only "errorcode 1".
        export PYTHONUNBUFFERED=1
        mpirun -n 2 uv run coverage run --source=dace --parallel-mode -m pytest -x --with-mpi --tb=short --timeout_method thread --timeout=300 -m "mpi and not gpu"

    - name: Test ScaLAPACK PBLAS with pytest
      run: |
        export NOSTATUSBAR=1
        ulimit -s 65536 || true
        export OMP_STACKSIZE=64M
        export DACE_compiler_max_stack_array_size=65536
        export DACE_testing_serialization=1
        export DACE_testing_deserialize_exception=1
        export DACE_cache=unique
        export DACE_library_pblas_default_implementation=ReferenceOpenMPI
        # See the MPI step above: without this an aborting rank takes its traceback with it.
        export PYTHONUNBUFFERED=1
        # TEMPORARY [WIP] probe for the grid-[2,1] pgemm red; delete with the finding.
        # Rounds 1-2: the environment is cleared (thread counts, BTL list; a one-BLAS-thread run
        # still fails), and tests/library, tests/passes and tests/sdfg each poison it alone while
        # tests/blas, tests/codegen and tests/transformations do not. Every variant also built a
        # DIFFERENT pdgemm SDFG, so this captures the generated program and diffs it.
        export DACE_cache=hash
        export DACE_default_build_folder=$RUNNER_TEMP/pblasprobe
        rm -rf "$DACE_default_build_folder"*
        newest_cpp () { ls -td "$DACE_default_build_folder"_rank0/pgemm_test_pdgemm_*/ 2>/dev/null | head -1; }
        probe () {
          local label="$1"; shift
          local verdict=FAIL
          if mpirun -n 2 --oversubscribe uv run python -m pytest -x --with-mpi --tb=no \
              -p no:cacheprovider --timeout_method thread --timeout=600 -m "scalapack" \
              tests/library/pblas/pgemm_test.py "$@" > "/tmp/probe_$label.log" 2>&1; then
            verdict=PASS
          fi
          local dir; dir=$(newest_cpp)
          cp "$dir/src/cpu/pgemm_test_pdgemm.cpp" "/tmp/cpp_$label.cpp" 2>/dev/null || true
          echo "PROBE $label $verdict sdfg=$(basename "$dir" | sed 's#.*pdgemm_##') lines=$(wc -l < "/tmp/cpp_$label.cpp" 2>/dev/null || echo 0)"
        }
        probe base
        probe library tests/library
        probe passes tests/passes
        probe sdfg tests/sdfg
        probe lib_a_l "tests/library/[a-l]*"
        probe lib_m_z "tests/library/[m-z]*"
        echo '===== diff base vs library ====='
        diff -u /tmp/cpp_base.cpp /tmp/cpp_library.cpp | head -200 || true
        echo '===== diff base vs passes ====='
        diff -u /tmp/cpp_base.cpp /tmp/cpp_passes.cpp | head -80 || true
        echo '===== PROBES DONE ====='

    - name: Report overall coverage
      uses: ./.github/actions/report-coverage

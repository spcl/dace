name: Formal Semantics (Lean)

on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'tests/formal/**'
      - 'dace/**'
      - 'tests/schedule_tree/**'
      - '.github/workflows/formal-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'formal/**'
      - 'tests/formal/**'
      - 'dace/**'
      - 'tests/schedule_tree/**'
      - '.github/workflows/formal-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  lean:
    name: Build, check proofs and differential tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    env:
      # Fixed seed for the corpus inputs (combined with each program's own seed).
      CORPUS_SEED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DaCe
        run: |
          python -m pip install --upgrade pip
          # DaCe's dependencies include numpy and cmake; g++ ships with ubuntu-latest.
          python -m pip install -e .
          g++ --version
          cmake --version

      # Mathlib's prebuilt `.olean`s come from its cache (`lake exe cache get`).
      # The executables are built here too, so that lean-action's GitHub cache
      # of `formal/.lake` (saved right after this build, keyed on the toolchain
      # and the Lake manifest, restoring the latest commit's on a miss) also
      # holds Mathlib's object files: the Mathlib cache provides only the C code,
      # and compiling it for the executables otherwise takes most of the job.
      - name: Build Lean library and executables (with Mathlib and GitHub caches)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: true
          use-github-cache: true
          build-args: "Dace dace-interp dace-equiv"

      - name: Sorry / axiom / import-isolation checks
        working-directory: formal
        run: scripts/check_axioms.sh

      - name: Generate the corpus (SDFG and schedule-tree JSON)
        run: python formal/scripts/dump_corpus.py

      - name: Record inputs and expected outputs with DaCe
        run: python formal/scripts/difftest.py --record --seed "$CORPUS_SEED"

      - name: Lean corpus tests
        working-directory: formal
        run: |
          for t in tests/*.lean; do
            echo "::group::$t"
            lake env lean "$t"
            echo "::endgroup::"
          done

      - name: Differential test (SDFG interpreter vs. DaCe)
        run: python formal/scripts/difftest.py --check --ir sdfg

      - name: Differential test (schedule-tree interpreter vs. DaCe)
        run: python formal/scripts/difftest.py --check --ir stree

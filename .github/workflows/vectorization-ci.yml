name: Vectorization

# Dedicated runner for the vectorization suite (-m vectorization, marked by path in
# tests/conftest.py). General CI deselects it, so these tests run ONCE here instead of
# across its python x simplify matrix.
#
# Split into two cells because a corpus case COMPILES AND RUNS a C++ program, so wall time
# tracks the number of (kernel, phase) cells rather than the number of assertions. Both cells
# enter the vectorizer through canonicalize: canonicalization exposes strictly more
# parallelizable patterns than plain simplification (measured on TSVC: 170/223 kernels get a
# parallel map after canonicalize versus 109/223 after upstream LoopToMap alone), so a
# simplify-front-end cell tests the vectorizer on a weaker version of the same input.
#
#   c1 -- npbench + polybench corpora, plus every non-corpus vectorization test
#   c2 -- tsvc + tsvc_2.5 corpora, the two biggest
#
# Each corpus test covers BOTH phases per kernel (``canon`` and ``canon_vec``), so canonicalize
# output and vectorizer output are checked in one compile rather than two.

on:
  push:
    branches: [ main, ci-fix ]
  pull_request:
    branches: [ main, ci-fix ]
  merge_group:
    branches: [ main, ci-fix ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  vectorization:
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: c1-npbench-polybench
            # Everything except the two TSVC corpora, which are cell 2.
            paths: >-
              tests/passes/vectorization
              --ignore=tests/passes/vectorization/tsvc_canonicalize_vectorize_corpus_test.py
              --ignore=tests/passes/vectorization/tsvc_2_5_canonicalize_vectorize_corpus_test.py
          - cell: c2-tsvc
            paths: >-
              tests/passes/vectorization/tsvc_canonicalize_vectorize_corpus_test.py
              tests/passes/vectorization/tsvc_2_5_canonicalize_vectorize_corpus_test.py

    name: ${{ matrix.cell }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - uses: ./.github/actions/setup-dace
      with:
        python-version: '3.14'
        apt-packages: >-
          libyaml-dev cmake
          libblas-dev libopenblas-dev liblapacke-dev
          g++-aarch64-linux-gnu
        pip-packages: pytest-xdist
        extras: testing

    - name: Test with pytest
      run: |
        export NOSTATUSBAR=1
        export DACE_cache=unique
        # New codegens only; no autoopt, no serialization round-trip.
        export DACE_compiler_cpu_implementation=experimental_readable
        export DACE_compiler_cuda_implementation=experimental
        export DACE_optimizer_automatic_simplification=1
        # Pinned, not left to the defaults: build caching is most of the wall time here.
        export DACE_compiler_command_cache=1
        export DACE_compiler_precompiled_header=1
        # loadgroup, not the default load: corpus cases carry xdist_group(kernel) so one kernel's
        # phases land on one worker and share its memoized base SDFG instead of rebuilding per worker.
        pytest ${{ matrix.paths }} \
          -n auto --dist loadgroup --tb=short --timeout_method thread --timeout=600 \
          -m "vectorization and not gpu and not long and not sequential and not perf"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    {include-group = 'docs'},
    {include-group = 'linting'},
    {include-group = 'testing'}
]
docs = ["jinja2<3.2.0", "sphinx-autodoc-typehints", "sphinx-rtd-theme>=0.5.1"]
linting = ["pre-commit==4.1.0", "yapf==0.43.0", "ruff==0.15.5"]
ml-testing = [
    "coverage",
    "pytest-cov",
    "scipy",
    "absl-py",
    "opt_einsum",
    "pymlir",
    "click",
    "ipykernel",
    "nbconvert",
    "pytest-timeout",
    "transformers==5.5.0",
    "jax<=0.6.2",
    "efficientnet_pytorch",
]
testing = [
    "coverage",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "flake8",
    "scipy",
    "absl-py",
    "opt-einsum>=3.0",
    "pymlir",
    "ipykernel",
    "nbformat",
    "nbconvert",
    # Plotting the corpus perf results; analysis only, never imported by dace itself.
    "matplotlib",
]

[project]
name = "dace"
dynamic = ["version"]
description = "Data-Centric Parallel Programming Framework"
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "SPCL @ ETH Zurich", email = "talbn@inf.ethz.ch"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    # Cap is <3.7, not <=3.5. networkx 3.6 dropped the root from ``immediate_dominators``
    # (it computes with ``{start: None}``, then ``del idom[start]`` before returning), and
    # every caller here reads that map as total over the reachable blocks, so an entry block
    # raised ``KeyError`` and the whole canonicalize pipeline died. The backend layer
    # (``dace/graphlib/networkx_backend.py``) restores the entry, which is what a backend
    # layer is for, so 3.6 is supported. The cap stays so the NEXT contract change surfaces
    # as a pip resolution error rather than as a KeyError mid-pipeline.
    "networkx>=2.5,<3.7",
    "astunparse",
    "sympy>=1.9",
    "pyyaml",
    "ply",
    "fparser>=0.1.3,!=0.2.3",
    "dill",
    "pyreadline; platform_system == 'Windows'",
    "packaging",
    "typing-extensions",
    "ml_dtypes",
    "ordered-set>=4.0.0",
    # SMT-backed dependence oracle. Not optional: LoopToMap and the canonicalize
    # parallelization band query it, so an install without it silently refuses
    # loops the shipped analysis can otherwise prove parallel.
    "z3-solver",
    # Exact-integer polyhedral engine. Not optional for the same reason: WavefrontSkew is a silent
    # no-op without it, so a wavefront nest (polybench nussinov, seidel_2d, the fdtd family) keeps
    # its sequential loops and the canonical form an install produces depends on which extras were
    # picked. Whether a scope is parallel is not allowed to be an install-time accident.
    "islpy",
    "scikit-build",
    "cmake",
    "ninja",
    "click>=8.0",
]

[project.optional-dependencies]
ml = ["onnx", "torch", "onnxsim", "onnxscript", "onnxruntime", "protobuf", "ninja"]
mpi = ["mpi4py", "pytest-mpi"]
gpu = ["cupy-cuda13x", "cutensor-cu13"]
# Optional: rustworkx-backed graph implementation (dace.graph.backends.rustworkx).
fastgraph = ["rustworkx"]

[project.scripts]
dacelab = "dace.cli.dacelab:main"
sdfv = "dace.cli.sdfv:main"
sdfgcc = "dace.cli.sdfgcc:main"
sdfg-diff = "dace.cli.sdfg_diff:main"
fcfd = "dace.cli.fcdc:main"
daceprof = "dace.cli.daceprof:main"
dace-external-transformation-registry = "dace.cli.external_transformation_registry:main"

[project.urls]
Homepage = "https://github.com/spcl/dace"

[tool.setuptools.dynamic]
version = {attr = "dace.version.__version__"}

[tool.setuptools.packages.find]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
dace = [
    "*.yml",
    "codegen/CMakeLists.txt",
    "codegen/tools/*.cpp",
    "codegen/**/*.cmake",
    "external/moodycamel/*.h",
    "external/moodycamel/LICENSE.md",
    "external/cub/cub/**/*",
    "external/cub/LICENSE.TXT",
    "runtime/include/**/*",
    "libraries/**/include/**/*",
    "viewer/webclient/dist/*.js",
    "viewer/webclient/external_libs/**/*",
    "viewer/webclient/*.css",
    "viewer/webclient/*.html",
    "viewer/templates/**/*",
    "viewer/**/LICENSE",
]

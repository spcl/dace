default_language_version:
  python: python3

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.5
  hooks:
    - id: ruff-check
      args: [--fix]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/google/yapf
  rev: v0.43.0
  hooks:
    - id: yapf
      name: yapf
      language: python
      entry: yapf
      types: [python]
- repo: local
  hooks:
    # No leading-underscore module/variable/parameter names, no `import x as x` (redundant
    # alias), `import x as _y`, or `from m import _name`. Diff mode (the default, no flag
    # needed) checks only lines this commit adds, so pre-existing `_private` code is untouched.
    - id: no-leading-underscore-names
      name: no leading-underscore names / redundant import aliases (added lines)
      entry: python tools/check_names.py
      language: system
      files: '\.py$'
